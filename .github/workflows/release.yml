# Tag releases: push a version tag (v0.1.0, v0.1.1, …) to publish that exact
# release. Only version tags are published — no rolling tag is created.
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack the plugin
        run: git archive --format=tar.gz -o "dsh-theme-picker-${GITHUB_REF_NAME}.tgz" HEAD
      - name: Publish the version release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: dsh-theme-picker-${{ github.ref_name }}.tgz
          generate_release_notes: true
