# Tag releases: push a version tag (v0.1.0, v0.1.1, …) to publish that exact
# release and move the rolling `latest` tag/release to it.
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack the plugin
        run: |
          git archive --format=tar.gz -o "dsh-theme-picker-${GITHUB_REF_NAME}.tgz" HEAD:dsh-theme-picker
          cp "dsh-theme-picker-${GITHUB_REF_NAME}.tgz" dsh-theme-picker.tgz
      - name: Publish the version release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: |
            dsh-theme-picker-${{ github.ref_name }}.tgz
            dsh-theme-picker.tgz
          generate_release_notes: true
      - name: Move the rolling latest tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          git tag -f latest "$GITHUB_SHA"
          git push -f origin latest
          gh release create latest --title latest \
            --notes "Rolling release: the newest tagged version, currently ${GITHUB_REF_NAME}. Install with: dsh plugin --profile web add github:${GITHUB_REPOSITORY}#latest — or download the archive below." \
            dsh-theme-picker.tgz
